<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Urna · votações ao vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1c;--card:#161a2d;--line:#252a45;--tx:#f2f3fa;--mut:#8b90b0;--ok:#3ddc97}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,#2a1f5c55,transparent),var(--bg);color:var(--tx);font-family:'Bricolage Grotesque',system-ui,sans-serif;display:flex;justify-content:center;padding:32px 16px 64px}
main{width:100%;max-width:680px}
h1{font-size:clamp(30px,6vw,48px);line-height:1.05;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;color:var(--mut);font-size:15px}
.pill{padding:5px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;color:var(--tx)}
.pill.live{color:var(--ok);border-color:#3ddc9755}
.pill.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;animation:pulse 1.6s infinite}
.pill.end{color:#ff7a8a;border-color:#ff7a8a55}
@keyframes pulse{50%{opacity:.25}}
.opt{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:16px;margin-bottom:12px;padding:0;overflow:hidden;font:inherit;min-height:68px}
button.opt{cursor:pointer;transition:transform .15s,border-color .15s}
button.opt:hover{transform:translateY(-2px);border-color:var(--c)}
button.opt:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8c7bff;outline-offset:2px}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),color-mix(in srgb,var(--c) 28%,transparent));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px}
.nm{font-size:19px;font-weight:600;word-break:break-word}
.nm small{display:block;color:var(--mut);font-weight:400;font-size:13px;margin-top:2px}
.pc{font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.opt.win{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 10px 40px -12px var(--c)}
.opt.mine .nm::after{content:" ✓ seu voto";font-size:13px;color:var(--ok);font-weight:600}
.hint{color:var(--mut);font-size:14px;margin:16px 0}
.panel{margin-top:40px;padding:22px;border:1px dashed var(--line);border-radius:18px}
.panel h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:14px;color:var(--mut);margin:14px 0 6px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1224;color:var(--tx);font:inherit}
.dur{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts input{margin-bottom:8px}
.oline{display:flex;gap:8px}.oline button{flex:none}
.btn{padding:12px 18px;border-radius:12px;border:0;font:inherit;font-weight:600;cursor:pointer;background:#6f5cff;color:#fff;margin:8px 8px 0 0}
.btn.sec{background:var(--line)}.btn.danger{background:#e5465a}
.err{color:#ff7a8a;font-size:14px;margin-top:10px}
.empty{padding:50px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:18px}
.foot{margin-top:34px;font-size:13px;color:var(--mut);text-align:center}
.top{margin-bottom:38px}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6f5cff,#ff5c8a);box-shadow:0 6px 20px -4px #6f5cff99}
.tag{margin:6px 0 0;color:var(--mut);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.stat b{display:block;font-size:clamp(17px,4.4vw,24px);font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat span{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.how{margin-top:40px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:6px 22px}
.how summary{cursor:pointer;font-weight:800;font-size:19px;padding:16px 0;list-style:none}
.how summary::after{content:"+";float:right;color:var(--mut)}
.how[open] summary::after{content:"–"}
.how h3{font-size:15px;margin:18px 0 8px}
.how ol,.how ul{margin:0 0 14px;padding-left:22px;color:var(--mut);line-height:1.6;font-size:15px}
.how li b{color:var(--tx)}
.how p{color:var(--mut);font-size:14px;line-height:1.55;margin:0 0 16px}
.warn{padding:12px 16px;border-radius:12px;background:#ffb34716;border:1px solid #ffb34755;color:#ffcf8a;font-size:14px;line-height:1.5;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ok);color:#06251a;font-weight:700;padding:10px 18px;border-radius:99px;z-index:9}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ============ CONFIGURAÇÃO ============
   Cole aqui a URL do seu Firebase Realtime Database para a votação ser compartilhada
   entre todos os visitantes. Exemplo: "https://meu-projeto-default-rtdb.firebaseio.com"
   Deixe vazio para testar (os votos ficam só no seu navegador). */
const DB_URL = "";
/* ====================================== */

const COLORS=["#6f5cff","#ff5c8a","#2ec4b6","#ffb347","#4da3ff","#b86bff","#7be05a","#ff7a45","#38d4f0","#f06bd5"];
const $=s=>document.querySelector(s), app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- armazenamento ---- */
const db=DB_URL?{
  get:async p=>(await fetch(`${DB_URL.replace(/\/$/,'')}/${p}.json`)).json(),
  put:async(p,v)=>fetch(`${DB_URL.replace(/\/$/,'')}/${p}.json`,{method:'PUT',body:JSON.stringify(v)}),
  post:async(p,v)=>fetch(`${DB_URL.replace(/\/$/,'')}/${p}.json`,{method:'POST',body:JSON.stringify(v)}),
  del:async p=>fetch(`${DB_URL.replace(/\/$/,'')}/${p}.json`,{method:'DELETE'})
}:{
  get:async p=>JSON.parse(localStorage.getItem('v:'+p)||'null'),
  put:async(p,v)=>localStorage.setItem('v:'+p,JSON.stringify(v)),
  post:async(p,v)=>{const o=JSON.parse(localStorage.getItem('v:'+p)||'{}');o[Math.random().toString(36).slice(2)]=v;localStorage.setItem('v:'+p,JSON.stringify(o))},
  del:async p=>localStorage.removeItem('v:'+p)
};

let poll=null,votes={},owner=(()=>{try{return sessionStorage.getItem('owner')==='1'}catch(e){return false}})(),creating=false,formOpts=['',''],err='',drawn='';
const adminPage=()=>location.hash==='#admin';
const isAdmin=()=>adminPage()&&owner;
const norm=t=>t.replace(/\s+/g,'').toLowerCase();
function browsers(){const u=navigator.userAgent;let n=/Edg\//.test(u)?'edge':/OPR\/|Opera/.test(u)?'opera':/Firefox\//.test(u)?'firefox':/Chrome\/|CriOS/.test(u)?'chrome':/Safari\//.test(u)?'safari':'';return navigator.brave?[n,'brave']:[n]}
function ownerPass(n){const d=new Date(),h=d.getHours()%12||12;return (d.getFullYear()-h)+'Dono///Lorenzo?'+n}
const baseUrl=()=>location.href.split('#')[0].split('?')[0];
const shareUrl=()=>poll.vis==='link'?baseUrl()+'?v='+poll.key:baseUrl();
const visible=()=>poll&&(poll.vis!=='link'||isAdmin()||new URLSearchParams(location.search).get('v')===poll.key);
const isOpen=()=>poll&&!poll.closed&&Date.now()<poll.endsAt;
const myKey=()=>poll&&'voted:'+poll.id;
const myVote=()=>{try{return localStorage.getItem(myKey())}catch(e){return null}};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');

async function load(){
  try{poll=await db.get('poll');votes=poll?(await db.get('votes')||{}):{}}catch(e){}
  render();
}
function counts(){
  const c=poll.options.map(()=>0);
  Object.values(votes).forEach(v=>{if(c[v.o]!==undefined)c[v.o]++});
  return c;
}
function fmt(ms){
  if(ms<=0)return'encerrada';
  const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  return (d?d+'d ':'')+(h||d?h+'h ':'')+m+'min '+(d?'':x+'s');
}

function pollView(){
  const c=counts(),tot=c.reduce((a,b)=>a+b,0),open=isOpen(),mine=myVote(),max=Math.max(...c);
  const canVote=open&&mine===null;
  const lead=!tot?'—':c.filter(x=>x===max).length>1?'Empate':esc(poll.options[c.indexOf(max)]);
  let h=`<h1>${esc(poll.title)}</h1><div class="bar">
    <span class="pill ${open?'live':'end'}" id="st">${open?'Aberta':'Encerrada'}</span>${isAdmin()?`<span class="pill">${poll.vis==='link'?'🔗 Só com link':'🌐 Pública'}</span>`:''}
    <button class="btn sec" id="copy" style="margin:0">Copiar link para compartilhar</button></div>
    <div class="stats"><div class="stat"><b>${tot}</b><span>voto${tot===1?'':'s'}</span></div>
    <div class="stat"><b id="cd">${open?fmt(poll.endsAt-Date.now()):'Encerrada'}</b><span>${open?'tempo restante':'votação'}</span></div>
    <div class="stat"><b>${lead}</b><span>${open?'na frente':'resultado'}</span></div></div>`;
  poll.options.forEach((o,i)=>{
    const p=tot?c[i]/tot*100:0, cls=`opt${!open&&tot&&c[i]===max?' win':''}${String(i)===mine?' mine':''}`;
    const inner=`<div class="fill" data-w="${p}"></div><div class="row"><div class="nm">${esc(o)}<small>${c[i]} voto${c[i]===1?'':'s'}</small></div><div class="pc">${p.toFixed(p%1?1:0)}%</div></div>`;
    h+=canVote?`<button class="${cls}" style="--c:${COLORS[i%10]}" data-v="${i}">${inner}</button>`
              :`<div class="${cls}" style="--c:${COLORS[i%10]}">${inner}</div>`;
  });
  h+=`<p class="hint">${canVote?'Toque em uma opção para votar. Cada pessoa vota uma vez.':open?'Obrigado pelo voto! Os resultados se atualizam sozinhos.':'A votação foi encerrada.'}</p>`;
  return h;
}

function adminView(){
  if(!owner)return `<div class="panel"><h2>Área do dono</h2><label>Senha secreta do dono</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="unlock">Entrar</button><div class="err">${err}</div></div>`;
  let h='<div class="panel">';
  if(poll&&isOpen()&&!creating)h+=`<h2>Controle da votação</h2><button class="btn danger" id="stop">Encerrar agora</button><button class="btn sec" id="vis">${poll.vis==='link'?'Tornar pública':'Deixar só com link'}</button><button class="btn sec" id="newp">Criar nova votação</button>`;
  else if(poll&&!creating)h+=`<h2>Votação encerrada</h2><button class="btn" id="newp">Criar nova votação</button>`;
  else h+=`<h2>Nova votação</h2>
    <label>Nome da votação</label><input id="ti" maxlength="80" placeholder="Ex.: Qual será o nome do projeto?">
    <label>Opções</label><div class="opts">${formOpts.map((v,i)=>`<div class="oline"><input class="oi" maxlength="60" value="${esc(v)}" placeholder="Opção ${i+1}">${formOpts.length>2?`<button class="btn sec" data-rm="${i}" aria-label="Remover">✕</button>`:''}</div>`).join('')}</div>
    ${formOpts.length<10?'<button class="btn sec" id="add">+ Adicionar opção</button>':''}
    <label>Tempo para votar</label><div class="dur"><input id="dn" type="number" min="1" value="1"><select id="du"><option value="60000">minutos</option><option value="3600000" selected>horas</option><option value="86400000">dias</option></select></div>
    <label>Quem pode ver</label><select id="vs"><option value="public">Pública: aparece para todos que abrirem o site</option><option value="link">Só com link: só entra quem receber o endereço</option></select>
    
    <button class="btn" id="go">Iniciar votação</button><div class="err">${err}</div>`;
  return h+'<button class="btn sec" id="logout">Sair do modo dono</button></div>';
}

function render(){
  if(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)&&adminPage())return;
  let h=`<header class="top"><div class="brand"><i></i>Urna</div><p class="tag">Votações ao vivo, sem cadastro e sem complicação.</p></header>`;
  document.title=visible()?poll.title+' · Urna':'Urna · votações ao vivo';
  if(isAdmin()&&!DB_URL)h+=`<div class="warn"><b>Modo de teste:</b> os votos ficam salvos só neste navegador. Para que todos votem na mesma urna, coloque a URL do Firebase em <code>DB_URL</code> no topo do script.</div>`;
  if(visible())h+=pollView();
  else if(!adminPage())h+=`<div class="empty">Nenhuma votação aberta agora.<br>Volte em breve — o dono do site ainda vai criar a próxima.</div>`;
  if(adminPage())h+=adminView();
  h+=`<details class="how" ${visible()?'':'open'}><summary>Como funciona</summary>
    <h3>Para quem vota</h3><ol><li><b>Escolha</b> a opção que preferir, é só tocar nela.</li><li><b>Pronto:</b> seu voto entra na contagem na hora.</li><li><b>Acompanhe</b> as porcentagens ao vivo até o tempo acabar.</li></ol>
    <p>Cada navegador vota uma única vez por votação. Os votos são anônimos.</p>
    <h3>Para o dono do site</h3><ul><li>Toque em <b>Eu sou o dono</b> (no fim da página) e digite a senha secreta.</li><li>Defina o <b>nome</b>, as <b>opções</b> (2 a 10) e o <b>tempo</b>.</li><li>Escolha se a votação é <b>pública</b> (aparece para todos) ou <b>só com link</b> (só entra quem recebeu o endereço). Dá para mudar depois.</li><li>Use <b>Encerrar agora</b> quando quiser parar antes do prazo.</li><li>Ao criar uma nova votação, os votos anteriores são apagados.</li></ul></details>
    <div class="foot">Urna · feita para rodar no GitHub Pages<br><button class="btn sec" id="own" style="margin-top:14px;padding:8px 14px;font-size:13px">${owner?'Painel do dono':'Eu sou o dono'}</button></div>`;
  if(h===drawn)return;drawn=h;app.innerHTML=h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%')));
  bind();
}

function bind(){
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{
    if(!isOpen()||myVote()!==null)return;
    try{localStorage.setItem(myKey(),b.dataset.v)}catch(e){}
    await db.post('votes',{o:+b.dataset.v,t:Date.now()});load();
  });
  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  on('#unlock',()=>{const v=norm($('#pw').value);if(browsers().some(n=>v===norm(ownerPass(n)))){owner=true;try{sessionStorage.setItem('owner','1')}catch(e){}err=''}else err='Senha incorreta.';document.activeElement.blur();drawn='';render()});
  on('#logout',()=>{owner=false;try{sessionStorage.removeItem('owner')}catch(e){}location.hash='';drawn='';render()});
  on('#own',()=>{if(adminPage()){drawn='';render()}else location.hash='#admin'});
  on('#copy',async()=>{try{await navigator.clipboard.writeText(shareUrl())}catch(e){}const t=document.createElement('div');t.className='toast';t.textContent='Link copiado!';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)});
  on('#vis',async()=>{await db.put('poll/vis',poll.vis==='link'?'public':'link');load()});
  on('#stop',async()=>{await db.put('poll/closed',true);load()});
  on('#newp',()=>{formOpts=['',''];creating=true;drawn='';render()});
  on('#add',()=>{keep();formOpts.push('');drawn='';render()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{keep();formOpts.splice(+b.dataset.rm,1);drawn='';render()});
  on('#go',create);
  if($('#pw'))$('#pw').onkeydown=e=>e.key==='Enter'&&$('#unlock').click();
}
function keep(){const a=[...document.querySelectorAll('.oi')].map(i=>i.value);formOpts=a}
async function create(){
  const title=$('#ti').value.trim(),opts=[...document.querySelectorAll('.oi')].map(i=>i.value.trim()).filter(Boolean),
    dur=+$('#dn').value*+$('#du').value;
  if(!title)return fail('Dê um nome à votação.');
  if(opts.length<2||new Set(opts).size<opts.length)return fail('Preencha ao menos 2 opções diferentes.');
  if(!(dur>0))return fail('Informe um tempo válido.');
  await db.del('votes');
  await db.put('poll',{id:Date.now().toString(36),title,options:opts,endsAt:Date.now()+dur,closed:false,vis:$('#vs').value,key:Math.random().toString(36).slice(2,12)});
  creating=false;err='';formOpts=['',''];drawn='';await load();
}
function fail(m){const e=document.querySelector('.err');if(e)e.textContent=m}

setInterval(()=>{
  const cd=$('#cd'),st=$('#st');
  if(poll&&cd){if(isOpen())cd.textContent=fmt(poll.endsAt-Date.now());else if(st&&st.textContent==='Aberta'){drawn='';render()}}
},1000);
setInterval(load,4000);
addEventListener('hashchange',()=>{drawn='';render()});
load();
</script>
</body>
</html>
